  <body>
    <script>
      /* Detect iOS "Request Desktop Site" and force a desktop-width viewport.
         iOS Safari changes the UA to look like macOS but keeps the real
         device width (~390 px).  CSS media queries then still pick the
         mobile breakpoint.  We fix this by spotting the discrepancy and
         rewriting the viewport meta before any layout runs. */
      (function () {
        var ua = navigator.userAgent || '';
        var isTouch = navigator.maxTouchPoints > 0 || 'ontouchstart' in window;
        // Desktop UA markers that iOS sends when "Request Desktop Site" is on
        var looksDesktop = /Macintosh|Mac OS X/.test(ua) && !/iPhone|iPad|iPod/.test(ua);
        if (isTouch && looksDesktop) {
          var meta = document.querySelector('meta[name="viewport"]');
          if (meta) {
            meta.setAttribute('content', 'width=1280, initial-scale=0.5');
          }
        }
      })();
    </script>

  </body>
