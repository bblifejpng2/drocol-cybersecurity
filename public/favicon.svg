<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none" shape-rendering="geometricPrecision">

  <!-- Background: deep charcoal #121212 -->
  <rect width="500" height="500" fill="#121212"/>

  <!-- Bottom layer â€” wide rounded rectangle, outline only -->
  <rect x="125" y="334" width="250" height="50" rx="16" ry="16"
    fill="none" stroke="#FFFFFF" stroke-width="16"/>

  <!-- Middle layer â€” wide rounded rectangle, outline only -->
  <rect x="125" y="258" width="250" height="50" rx="16" ry="16"
    fill="none" stroke="#FFFFFF" stroke-width="16"/>

  <!-- Top layer â€” diamond (45Â° rotated square), thick white border with cutout -->
  <rect x="186" y="102" width="128" height="128" rx="18" ry="18"
    fill="none" stroke="#FFFFFF" stroke-width="18"
    transform="rotate(45 250 166)"/>

  <!-- Orange accent â€” small rounded square centered inside diamond -->
  <rect x="223" y="139" width="54" height="54" rx="10" ry="10"
    fill="#F58220"
    transform="rotate(45 250 166)"/>

</svg>