<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Transparent background - carousel accent gradient shows through -->
  <!-- Subtle grid -->
  <line x1="0" y1="0" x2="400" y2="300" stroke="#10b981" stroke-width="0.5" opacity="0.15"/>
  <line x1="400" y1="0" x2="0" y2="300" stroke="#10b981" stroke-width="0.5" opacity="0.15"/>
  <line x1="100" y1="0" x2="100" y2="300" stroke="#10b981" stroke-width="0.5" opacity="0.1"/>
  <line x1="200" y1="0" x2="200" y2="300" stroke="#10b981" stroke-width="0.5" opacity="0.1"/>
  <line x1="300" y1="0" x2="300" y2="300" stroke="#10b981" stroke-width="0.5" opacity="0.1"/>
  <!-- Document frame with glow -->
  <rect x="115" y="70" width="170" height="140" rx="10" fill="none" stroke="url(#accent)" stroke-width="2.5" filter="url(#glow)"/>
  <!-- Header line -->
  <rect x="130" y="88" width="140" height="6" rx="3" fill="#10b981" opacity="0.85"/>
  <!-- Content lines -->
  <rect x="130" y="104" width="100" height="5" rx="2.5" fill="#10b981" opacity="0.4"/>
  <rect x="130" y="118" width="120" height="5" rx="2.5" fill="#10b981" opacity="0.5"/>
  <rect x="130" y="132" width="85" height="5" rx="2.5" fill="#10b981" opacity="0.4"/>
  <rect x="130" y="146" width="110" height="5" rx="2.5" fill="#10b981" opacity="0.55"/>
  <rect x="130" y="160" width="95" height="5" rx="2.5" fill="#10b981" opacity="0.4"/>
  <!-- Checkmark accent -->
  <path d="M165 195 L188 222 L252 170" fill="none" stroke="#10b981" stroke-width="3.5" opacity="0.9" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="200" y="270" text-anchor="middle" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="3" opacity="0.9">COMPLIANCE</text>
</svg>