<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E87722" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F5A623" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Transparent background - carousel accent gradient shows through -->
  <!-- Subtle grid -->
  <line x1="0" y1="0" x2="400" y2="300" stroke="#E87722" stroke-width="0.5" opacity="0.15"/>
  <line x1="400" y1="0" x2="0" y2="300" stroke="#E87722" stroke-width="0.5" opacity="0.15"/>
  <line x1="100" y1="0" x2="100" y2="300" stroke="#E87722" stroke-width="0.5" opacity="0.1"/>
  <line x1="200" y1="0" x2="200" y2="300" stroke="#E87722" stroke-width="0.5" opacity="0.1"/>
  <line x1="300" y1="0" x2="300" y2="300" stroke="#E87722" stroke-width="0.5" opacity="0.1"/>
  <!-- Radar circles with glow -->
  <circle cx="200" cy="160" r="80" fill="none" stroke="url(#accent)" stroke-width="2.5" filter="url(#glow)"/>
  <circle cx="200" cy="160" r="55" fill="none" stroke="#E87722" stroke-width="1.8" opacity="0.6"/>
  <circle cx="200" cy="160" r="30" fill="none" stroke="#E87722" stroke-width="1.5" opacity="0.8"/>
  <circle cx="200" cy="160" r="12" fill="#E87722" opacity="0.5"/>
  <!-- Crosshairs -->
  <line x1="200" y1="80" x2="200" y2="120" stroke="#E87722" stroke-width="2" opacity="0.5"/>
  <line x1="200" y1="200" x2="200" y2="240" stroke="#E87722" stroke-width="2" opacity="0.5"/>
  <line x1="120" y1="160" x2="160" y2="160" stroke="#E87722" stroke-width="2" opacity="0.5"/>
  <line x1="240" y1="160" x2="280" y2="160" stroke="#E87722" stroke-width="2" opacity="0.5"/>
  <!-- Diamond center -->
  <path d="M200 140 L215 160 L200 180 L185 160 Z" fill="#E87722" opacity="0.9" filter="url(#glow)"/>
  <text x="200" y="270" text-anchor="middle" fill="#E87722" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="3" opacity="0.9">INJECTION PROTECT</text>
</svg>