<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Number Extractor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <h1>Number Extractor</h1>
      <p>Extract sensitive data from the current page</p>
    </header>

    <div class="controls">
      <button id="extractBtn" class="extract-btn">Extract Numbers</button>
      <button id="clearBtn" class="clear-btn">Clear</button>
    </div>

    <div class="stats">
      <span id="totalCount">Total: 0</span>
    </div>

    <div id="results" class="results">
      <div class="category">
        <h3>Phone Numbers</h3>
        <ul id="phones"></ul>
      </div>
      <div class="category">
        <h3>Email Addresses</h3>
        <ul id="emails"></ul>
      </div>
      <div class="category">
        <h3>Credit Cards</h3>
        <ul id="cards"></ul>
      </div>
      <div class="category">
        <h3>IP Addresses</h3>
        <ul id="ips"></ul>
      </div>
      <div class="category">
        <h3>SSNs</h3>
        <ul id="ssns"></ul>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
